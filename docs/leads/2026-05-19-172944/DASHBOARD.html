const PROTO_BASE = 'https://fredericomatsuoka.github.io/VANT/leads/2026-05-19-172944/v1/';
function getProtoLink(lead) { return PROTO_BASE + 'PREMIUM_' + lead.slug + '.html'; }

function getWALink(lead, texto) {
  const c = lead.contatos.find(c => c.tipo === 'whatsapp');
  if (!c) return null;
  const phone = c.url.replace('https://wa.me/', '');
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(texto);
}

function getIGLink(lead) {
  const c = lead.contatos.find(c => c.tipo === 'instagram');
  if (!c) return null;
  const m = c.url.match(/instagram\.com\/([^/?#]+)/);
  return m ? 'https://ig.me/m/' + m[1] : null;
}

function saveStatuses() { localStorage.setItem(STATE_KEY, JSON.stringify(statuses)); updateStats(); }
function getStatus(id) { return statuses[id] || 'pendente'; }

function updateStats() {
  const counts = {pendente:0,contatado:0,respondeu:0,negociando:0,fechado:0};
  LEADS.forEach(l => { const s = getStatus(l.id); if (counts[s] !== undefined) counts[s]++; else counts.pendente++; });
  document.getElementById('statPendente').textContent = counts.pendente;
  document.getElementById('statContatado').textContent = counts.contatado;
  document.getElementById('statRespondeu').textContent = counts.respondeu;
  document.getElementById('statFechado').textContent = counts.fechado;
}

      `<button class="btn btn-outreach" onclick="openOutreach(${lead.id})">💬 Mensagens</button>`

            <option value="pendente" ${status==='pendente'?'selected':''}>Pendente</option>
            <option value="contatado" ${status==='contatado'?'selected':''}>Contatado</option>
            <option value="respondeu" ${status==='respondeu'?'selected':''}>Respondeu</option>
            <option value="negociando" ${status==='negociando'?'selected':''}>Em negociação</option>
            <option value="fechado" ${status==='fechado'?'selected':''}>Fechado</option>
            <option value="sem-interesse" ${status==='sem-interesse'?'selected':''}>Sem interesse</option>
          </select>
        </div>
      </div>
      <div class="card-actions">
        <div class="card-actions-row">
          <a href="${protoUrl}" target="_blank" class="btn btn-prototype">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>Ver Protótipo
          </a>
          <button onclick="navigator.clipboard.writeText('${protoUrl}').then(()=>{this.textContent='✓ Copiado';setTimeout(()=>this.textContent='Copiar Link',2000)}).catch(()=>{})" class="btn btn-download" style="cursor:pointer;border:1px solid var(--border)">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copiar Link
          </button>
        </div>
        <div class="card-actions-row">${sendRow}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  applyFilter();
  updateStats();
}

window.changeStatus = function(id, select) {
  statuses[id] = select.value;
  saveStatuses();
  select.className = `status-select s-${select.value}`;
};

function applyFilter() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.lead-card');
  let visible = 0;
  cards.forEach(card => {
    const id = parseInt(card.dataset.id);
    const lead = LEADS.find(l => l.id === id);
    const matchFilter = activeFilter === 'todos' || card.dataset.nicho === activeFilter;
    const matchSearch = !search || lead.nome.toLowerCase().includes(search) ||
      lead.nicho.toLowerCase().includes(search) || lead.cidade.toLowerCase().includes(search) ||
      lead.contatos.some(c => c.label.toLowerCase().includes(search));
    if (matchFilter && matchSearch) { card.classList.remove('hidden'); visible++; }
    else { card.classList.add('hidden'); }
  });
  document.getElementById('countVisible').textContent = visible;
  const ex = document.querySelector('.empty-state');
  if (ex) ex.remove();
  if (visible === 0) {
    const em = document.createElement('div');
    em.className = 'empty-state';
    em.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>Nenhum lead encontrado.</p>`;
    document.getElementById('leadsGrid').appendChild(em);
  }
}

document.getElementById('searchInput').addEventListener('input', applyFilter);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilter();
  });
});

window.openOutreach = function(id) {
  const lead = LEADS.find(l => l.id === id);
  if (!lead) return;
  const protoUrl = getProtoLink(lead);
  document.getElementById('modalTitle').textContent = lead.nome;
  document.getElementById('modalSub').textContent = lead.outreach.sub;

  const protoNote = `<div class="proto-note"><strong>Protótipo:</strong> <span>${protoUrl}</span><a href="${protoUrl}" target="_blank" class="btn-proto-dl">Abrir</a></div>`;
  const stagesHTML = lead.outreach.stages.map(stage => {
    const msgsHTML = stage.msgs.map(msg => {
      const fullTxt = msg.texto + (stage.num === 1 ? '\n\n🔗 Protótipo: ' + protoUrl : '');
      const waC = lead.contatos.find(c => c.tipo === 'whatsapp');
      const waBtn = waC && msg.canal === 'WhatsApp'
        ? `<a href="https://wa.me/${waC.url.replace('https://wa.me/','')}?text=${encodeURIComponent(fullTxt)}" target="_blank" class="btn-send-modal btn-send-wa">💬 Enviar WA</a>`
        : '';
      return `<div class="msg-block"><div class="msg-canal">${msg.canal}</div><div class="msg-text">${msg.texto}</div><div class="msg-actions">${waBtn}<button class="btn-send-modal btn-copy" onclick="navigator.clipboard.writeText(\`${fullTxt.replace(/\`/g,"'")}\`).then(()=>{showToast()})">📋 Copiar</button></div></div>`;
    }).join('');
    return `<div class="stage-block"><div class="stage-head"><div class="stage-num">${stage.num}</div><div class="stage-info"><div class="stage-title">${stage.titulo}</div><div class="stage-date">${stage.data}</div></div></div>${msgsHTML}</div>`;
  }).join('');

  document.getElementById('modalBody').innerHTML = protoNote + stagesHTML;
  document.getElementById('modalOverlay').classList.add('open');
};

document.getElementById('modalClose').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').onclick = e => { if (e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('open'); };

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderCards();
</script>
</body>
</html>
