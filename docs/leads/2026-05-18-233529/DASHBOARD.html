  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0F;
      --bg2: #111118;
      --bg3: #18181F;
      --bg4: #1E1E28;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #F0F0F5;
      --text2: #9090A8;
      --text3: #5A5A72;
      --accent: #6C63FF;
      --accent2: #8B84FF;
      --green: #22C55E;
      --yellow: #F59E0B;
      --red: #EF4444;
      --blue: #3B82F6;
      --pink: #EC4899;
      --r: 10px;
      --font: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ===== HEADER ===== */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800; color: #fff;
    }
    .header-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .header-sub { font-size: 0.72rem; color: var(--text3); margin-left: 4px; }
    .header-meta { display: flex; align-items: center; gap: 20px; }
    .header-run {
      font-size: 0.7rem; color: var(--text3);
      background: var(--bg3); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 20px;
    }
    .header-run span { color: var(--text2); }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 1px; background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      background: var(--bg2); padding: 18px 24px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-value.green { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.blue { color: var(--blue); }
    .stat-value.accent { color: var(--accent2); }

    /* ===== TOOLBAR ===== */
    .toolbar {
      padding: 16px 32px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .search-wrap {
      flex: 1; min-width: 220px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--bg3);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 9px 12px 9px 36px; font-family: var(--font);
      font-size: 0.83rem; color: var(--text);
      outline: none; transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text3); }
    .filter-btn {
      padding: 9px 16px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: var(--r);
      font-family: var(--font); font-size: 0.78rem; font-weight: 500;
      color: var(--text2); cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .toolbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .count-badge {
      font-size: 0.72rem; color: var(--text3);
      background: var(--bg3); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 20px;
    }
    .count-badge span { color: var(--accent2); font-weight: 700; }

    /* ===== GRID ===== */
    .leads-grid {
      padding: 24px 32px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ===== LEAD CARD ===== */
    .lead-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column;
    }
    .lead-card:hover { border-color: var(--border2); box-shadow: 0 4px 30px rgba(108,99,255,0.08); }
    .lead-card.hidden { display: none; }

    .card-header {
      padding: 16px 20px 12px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .card-num {
      font-size: 0.65rem; font-weight: 700; color: var(--text3);
      background: var(--bg3); border: 1px solid var(--border);
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-title-wrap { flex: 1; }
    .card-name { font-size: 0.92rem; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 0.63rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    }
    .badge-nicho { background: rgba(108,99,255,0.15); color: var(--accent2); }
    .badge-cidade { background: rgba(255,255,255,0.06); color: var(--text3); }
    .badge-seg { background: rgba(34,197,94,0.12); color: var(--green); }

    .card-body { padding: 14px 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    .card-contatos { display: flex; flex-direction: column; gap: 6px; }
    .contato-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--text2);
    }
    .contato-row svg { color: var(--text3); flex-shrink: 0; }
    .contato-row a { color: var(--accent2); text-decoration: none; transition: color 0.2s; }
    .contato-row a:hover { color: #fff; }

    .card-status-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 4px;
    }
    .status-label { font-size: 0.7rem; color: var(--text3); white-space: nowrap; }
    .status-select {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px; font-family: var(--font);
      font-size: 0.75rem; font-weight: 600; color: var(--text2);
      outline: none; cursor: pointer; transition: border 0.2s;
    }
    .status-select:focus { border-color: var(--accent); }
    .status-select.s-pendente { color: var(--text3); }
    .status-select.s-contatado { color: var(--yellow); }
    .status-select.s-respondeu { color: var(--blue); }
    .status-select.s-negociando { color: var(--accent2); }
    .status-select.s-fechado { color: var(--green); }
    .status-select.s-sem-interesse { color: var(--red); }

    .card-actions {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column;
      gap: 8px;
    }
    .card-actions-row { display: flex; gap: 8px; }
    .btn {
      padding: 8px 12px; border-radius: 7px;
      font-family: var(--font); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; border: none; display: flex; align-items: center;
      justify-content: center; gap: 6px; transition: all 0.2s; text-decoration: none;
      flex: 1;
    }
    .btn-prototype {
      background: rgba(108,99,255,0.12); color: var(--accent2);
      border: 1px solid rgba(108,99,255,0.25);
    }
    .btn-prototype:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-download {
      background: rgba(255,255,255,0.04); color: var(--text3);
      border: 1px solid var(--border);
    }
    .btn-download:hover { background: var(--bg4); color: var(--text2); border-color: var(--border2); }
    .btn-outreach {
      background: rgba(34,197,94,0.1); color: var(--green);
      border: 1px solid rgba(34,197,94,0.2);
    }
    .btn-outreach:hover { background: var(--green); color: #000; border-color: var(--green); }
    .btn-wa {
      background: rgba(37,211,102,0.12); color: #25D366;
      border: 1px solid rgba(37,211,102,0.25);
    }
    .btn-wa:hover { background: #25D366; color: #fff; border-color: #25D366; }
    .btn-mail {
      background: rgba(59,130,246,0.1); color: var(--blue);
      border: 1px solid rgba(59,130,246,0.2);
    }
    .btn-mail:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-send-modal {
      font-size: 0.65rem; font-weight: 700; padding: 3px 10px;
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px; text-decoration: none;
    }
    .btn-send-wa { background: rgba(37,211,102,0.15); color: #25D366; border: 1px solid rgba(37,211,102,0.3); }
    .btn-send-wa:hover { background: #25D366; color: #fff; }
    .btn-send-email { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
    .btn-send-email:hover { background: var(--blue); color: #fff; }
    .modal-attach-note {
      background: rgba(108,99,255,0.07); border: 1px solid rgba(108,99,255,0.18);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
      font-size: 0.74rem; color: var(--text2);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .modal-attach-note strong { color: var(--text); }
    .btn-attach-dl {
      margin-left: auto; font-size: 0.69rem; color: var(--accent2);
      text-decoration: none; padding: 4px 10px;
      border: 1px solid rgba(108,99,255,0.3); border-radius: 4px;
      white-space: nowrap; transition: all 0.2s;
    }
    .btn-attach-dl:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 14px; width: 100%; max-width: 640px;
      max-height: 88vh; display: flex; flex-direction: column;
      transform: scale(0.95); transition: transform 0.25s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .modal-sub { font-size: 0.75rem; color: var(--text3); }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--bg3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text2); flex-shrink: 0;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--red); color: #fff; border-color: var(--red); }

    .modal-tabs {
      padding: 12px 24px 0;
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .modal-tab {
      padding: 8px 16px; font-size: 0.75rem; font-weight: 600;
      color: var(--text3); cursor: pointer; border-radius: 6px 6px 0 0;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .modal-tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
    .modal-tab:hover:not(.active) { color: var(--text2); }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .outreach-stage { margin-bottom: 28px; }
    .stage-header {
      display: flex; align-items: center; justify-content: space-between;

    }
    .stage-title {
      font-size: 0.78rem; font-weight: 700; color: var(--text);

    .stage-num {

    }
    .stage-date { font-size: 0.7rem; color: var(--text3); }
    .msg-block { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .msg-block-header {
      padding: 8px 14px;
      background: var(--bg4); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .msg-channel { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
    .copy-btn {
      font-size: 0.65rem; font-weight: 700; padding: 3px 10px;
      background: rgba(108,99,255,0.15); color: var(--accent2);

    .copy-btn.copied { background: rgba(34,197,94,0.2); color: var(--green); border-color: var(--green); }
    .msg-text {
      padding: 12px 14px;
      font-size: 0.8rem; line-height: 1.7; color: var(--text2);
      white-space: pre-wrap; word-break: break-word;
    }

    /* ===== EMPTY ===== */
    .empty-state {
      grid-column: 1/-1;
      text-align: center; padding: 80px 20px;
      color: var(--text3);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 0.85rem; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--green); color: #000;
      padding: 12px 20px; border-radius: 8px;
      font-size: 0.8rem; font-weight: 700;
      transform: translateY(60px); opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(3, 1fr); }
      .leads-grid { padding: 16px; grid-template-columns: 1fr; }
      .toolbar { padding: 12px 16px; }
      .header { padding: 0 16px; }
    }
  </style>
</head>

  // ===================== SEND LINK HELPERS =====================
  function getWALink(lead, texto) {
    const c = lead.contatos.find(c => c.tipo === 'whatsapp');
    if (!c) return null;
    const phone = c.url.replace('https://wa.me/', '');
    return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(texto);
  }

  function getEmailLink(lead, texto) {
    const c = lead.contatos.find(c => c.tipo === 'email');
    if (!c) return null;
    const lines = texto.split('\n');
    const subjectLine = lines[0];
    const subject = subjectLine.startsWith('Assunto:')
      ? subjectLine.replace('Assunto:', '').trim()
      : 'Protótipo exclusivo para ' + lead.nome;
    const body = lines.slice(2).join('\n');
    return 'mailto:' + c.label + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

      else counts.pendente++;
    });
    document.getElementById('statPendente').textContent = counts.pendente;
    document.getElementById('statContatado').textContent = counts.contatado;
    document.getElementById('statRespondeu').textContent = counts.respondeu;

  // ===================== FILTER / SEARCH =====================
  function applyFilter() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.lead-card');
    let visible = 0;

    cards.forEach(card => {
      const id = parseInt(card.dataset.id);
      const lead = LEADS.find(l => l.id === id);
      const matchFilter = activeFilter === 'todos' || card.dataset.nicho === activeFilter;
      const matchSearch = !search ||
        lead.nome.toLowerCase().includes(search) ||
        lead.nicho.toLowerCase().includes(search) ||
        lead.cidade.toLowerCase().includes(search) ||
        lead.contatos.some(c => c.label.toLowerCase().includes(search));

      if (matchFilter && matchSearch) {
        card.classList.remove('hidden');
        visible++;
      } else {
        card.classList.add('hidden');
      }
    });

    document.getElementById('countVisible').textContent = visible;

    // Show empty state
    const existing = document.querySelector('.empty-state');
    if (existing) existing.remove();
    if (visible === 0) {
      const em = document.createElement('div');
      em.className = 'empty-state';
      em.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>Nenhum lead encontrado para os filtros selecionados.</p>`;

          const sendBtn = sendLink
            ? (isWA
                ? `<a href="${sendLink}" target="_blank" class="btn-send-modal btn-send-wa"><svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Enviar WA</a>`
                : `<a href="${sendLink}" class="btn-send-modal btn-send-email"><svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Enviar E-mail</a>`)
            : '';
          return `
          <div class="msg-block">
            <div class="msg-block-header">
              <span class="msg-channel">${msg.canal}</span>
              <div style="display:flex;gap:5px;align-items:center;">
                ${sendBtn}
                <button class="copy-btn" onclick="copyMsg(this, \`${msg.texto.replace(/`/g,'\\`')}\`)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  Copiar
                </button>
              </div>
            </div>
            <div class="msg-text">${msg.texto.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
          </div>`;
        }).join('')}
      </div>
    `).join('');

    document.getElementById('modalOverlay').classList.add('open');
  };

  window.copyMsg = function(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('copied');
      btn.textContent = 'Copiado!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar`;
        showToast('Mensagem copiada!');
      }, 1200);
    });
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
  });

  // ===================== INIT =====================
  renderCards();
  </script>
</body>
</html>
